name: 🚀 Deploy Website

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cegah dua deploy berjalan bersamaan.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  pull-code:
    name: 📂 Pull latest code on server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 🔐 Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: github.com

      - name: Pull latest code
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            eval `ssh-agent -s`
            ssh-add ~/.ssh/gh_deploy_key

            cd /var/www/

            if [ ! -d "yongsu_desoyo" ]; then
              git clone git@github.com:yokoberek/yongsu-desoyo.git yongsu_desoyo
              cd yongsu_desoyo
            else
              cd yongsu_desoyo
              git fetch --all --prune
              git reset --hard origin/main
            fi

  build:
    name: 📦 Install dependencies and build assets
    runs-on: ubuntu-latest
    environment: production
    needs: pull-code
    steps:
      - name: Install dependencies and build assets
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /var/www/yongsu_desoyo

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.local/bin:$PATH"

            uv sync
            uv run python manage.py tailwind install
            uv run python manage.py tailwind build
            uv run python manage.py collectstatic --noinput
            uv run python manage.py migrate --noinput

  restart:
    name: 🧹 Restart Supervisor service
    runs-on: ubuntu-latest
    environment: production
    needs: build
    steps:
      - name: Restart Supervisor service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "Restart Supervisor service: yongsu_desoyo"
            sudo supervisorctl restart yongsu_desoyo
