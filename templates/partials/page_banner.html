{% comment %} Banner kepala halaman. Param: judul, crumb, gambar (wajib); eyebrow, subjudul, tinggi (opsional). {% endcomment %}
<section class="relative {{ tinggi|default:'min-h-[52vh]' }} flex items-end overflow-hidden bg-abyss">
  <img src="{{ gambar }}" alt="{{ judul }}"
       onerror="this.onerror=null;this.src='https://picsum.photos/seed/{{ crumb|slugify }}/1600/900'"
       class="absolute inset-0 h-full w-full object-cover" />
  <div class="absolute inset-0 bg-linear-to-t from-abyss via-abyss/55 to-abyss/20"></div>
  <div class="absolute inset-0 bg-linear-to-r from-abyss/70 via-transparent to-transparent"></div>

  <div class="relative z-10 mx-auto max-w-7xl w-full px-5 sm:px-8 pb-16 pt-32">
    <nav class="font-mono text-[11px] tracking-eyebrow uppercase text-kabut/60 mb-5" aria-label="Breadcrumb">
      <a href="{% url 'commons:index' %}" class="hover:text-emas transition">Beranda</a>
      <span class="mx-2 text-emas">/</span>
      <span class="text-kabut/90">{{ crumb }}</span>
    </nav>
    {% if eyebrow %}<p class="font-mono text-xs tracking-eyebrow uppercase text-emasS mb-4">{{ eyebrow }}</p>{% endif %}
    <h1 class="font-display font-extrabold text-kabut leading-[0.98] text-4xl sm:text-6xl max-w-3xl">{{ judul }}</h1>
    {% if subjudul %}<p class="mt-5 text-kabut/80 text-lg max-w-2xl leading-relaxed">{{ subjudul }}</p>{% endif %}
  </div>
</section>

<!-- Breadcrumb terstruktur untuk hasil pencarian (cocok dengan navigasi di atas) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Beranda",
      "item": "{{ request.scheme }}://{{ request.get_host }}{% url 'commons:index' %}"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{ crumb|escapejs }}",
      "item": "{{ request.scheme }}://{{ request.get_host }}{{ request.path }}"
    }
  ]
}
</script>
